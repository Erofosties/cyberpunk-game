spring.application.name=cyberpunk-server

# =========================
# SERVER
# =========================

server.port=${SERVER_PORT:8080}

# =========================
# DATABASE
# =========================
# Usa variables de entorno en produccion:
#   DB_URL, DB_USER, DB_PASS

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER:cyberpunk}
spring.datasource.password=${DB_PASS:1234}

# =========================
# JPA / HIBERNATE
# =========================

# update: aplica cambios incrementales sin borrar datos
# Para entorno limpio de desarrollo cambia a 'create'
spring.jpa.hibernate.ddl-auto=update

# Dialecto Oracle
spring.jpa.database-platform=org.hibernate.dialect.OracleDialect

# Mostrar SQL (desactivar en produccion)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# =========================
# PERFORMANCE DEBUG
# =========================

logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# =========================
# JWT
# =========================
# IMPORTANTE: cambia jwt.secret con env var JWT_SECRET en produccion
# Debe tener al menos 32 caracteres

jwt.secret=${JWT_SECRET:cyberpunk-default-secret-key-change-in-production!!}
jwt.expiration=${JWT_EXPIRATION:86400000}